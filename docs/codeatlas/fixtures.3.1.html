<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CodeAtlas</title>
<script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.4.0/cytoscape-dagre.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; }
  #cy { width: 100vw; height: 100vh; }
  header { padding: 12px 16px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<header>
  <strong>CodeAtlas</strong>
  <p>Owns 0 symbols across 0 file(s).</p>
</header>
<div id="cy"></div>
<script>
const data = {"nodes": [{"data": {"id": "container_project", "label": "container_project", "description": "Owns 0 symbols across 2 file(s)."}}, {"data": {"id": "cycle_project", "label": "cycle_project", "description": "Owns 0 symbols across 1 file(s)."}}, {"data": {"id": "malformed", "label": "malformed", "description": "Owns 0 symbols across 3 file(s)."}}, {"data": {"id": "node_project", "label": "node_project", "description": "Owns 0 symbols across 2 file(s)."}}, {"data": {"id": "osv_snapshot", "label": "osv_snapshot", "description": "Owns 0 symbols across 3 file(s)."}}, {"data": {"id": "pnpm_project", "label": "pnpm_project", "description": "Owns 0 symbols across 2 file(s)."}}, {"data": {"id": "python_project", "label": "python_project", "description": "Owns 0 symbols across 3 file(s)."}}, {"data": {"id": "rust_project", "label": "rust_project", "description": "Owns 0 symbols across 2 file(s)."}}, {"data": {"id": "uv_project", "label": "uv_project", "description": "Owns 0 symbols across 2 file(s)."}}, {"data": {"id": "yarn_berry_project", "label": "yarn_berry_project", "description": "Owns 0 symbols across 1 file(s)."}}, {"data": {"id": "yarn_classic_project", "label": "yarn_classic_project", "description": "Owns 0 symbols across 2 file(s)."}}], "edges": []};
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: data,
  style: [
    { selector: 'node', style: {
      'label': 'data(label)',
      'shape': 'round-rectangle',
      'background-color': '#eef2ff',
      'border-color': '#6366f1',
      'border-width': 1,
      'width': 'label',
      'padding': '10px',
      'text-valign': 'center',
      'text-halign': 'center',
      'font-size': '12px',
    }},
    { selector: 'edge', style: {
      'label': 'data(label)',
      'curve-style': 'bezier',
      'target-arrow-shape': 'triangle',
      'font-size': '10px',
      'text-rotation': 'autorotate',
    }}
  ],
  layout: { name: 'dagre', rankDir: 'LR' }
});
cy.on('tap', 'node', evt => {
  const node = evt.target;
  if (node.data('linkUrl')) { window.location.href = node.data('linkUrl'); }
});
</script>
</body>
</html>
