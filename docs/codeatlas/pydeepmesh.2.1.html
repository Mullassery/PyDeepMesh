<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CodeAtlas</title>
<script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.4.0/cytoscape-dagre.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; }
  #cy { width: 100vw; height: 100vh; }
  header { padding: 12px 16px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<header>
  <strong>CodeAtlas</strong>
  <p>Owns 58 symbols across 11 file(s).</p>
</header>
<div id="cy"></div>
<script>
const data = {"nodes": [{"data": {"id": "advisories", "label": "advisories", "description": "Owns 54 symbols across 10 file(s)."}}, {"data": {"id": "cli", "label": "cli", "description": "Owns 19 symbols across 2 file(s)."}}, {"data": {"id": "discovery", "label": "discovery", "description": "Owns 5 symbols across 2 file(s)."}}, {"data": {"id": "graph", "label": "graph", "description": "Owns 26 symbols across 3 file(s)."}}, {"data": {"id": "models", "label": "models", "description": "Owns 64 symbols across 8 file(s)."}}, {"data": {"id": "parsers", "label": "parsers", "description": "Owns 11 symbols across 3 file(s)."}}, {"data": {"id": "report", "label": "report", "description": "Owns 18 symbols across 5 file(s)."}}, {"data": {"id": "risk", "label": "risk", "description": "Owns 8 symbols across 2 file(s)."}}, {"data": {"id": "sbom", "label": "sbom", "description": "Owns 6 symbols across 2 file(s)."}}], "edges": [{"data": {"id": "edge_0", "source": "pydeepmesh", "target": "advisories", "label": "calls"}}, {"data": {"id": "edge_1", "source": "pydeepmesh", "target": "discovery", "label": "calls"}}, {"data": {"id": "edge_2", "source": "pydeepmesh", "target": "graph", "label": "calls"}}, {"data": {"id": "edge_3", "source": "pydeepmesh", "target": "parsers", "label": "calls"}}, {"data": {"id": "edge_4", "source": "pydeepmesh", "target": "report", "label": "calls"}}, {"data": {"id": "edge_5", "source": "pydeepmesh", "target": "risk", "label": "calls"}}, {"data": {"id": "edge_6", "source": "pydeepmesh", "target": "sbom", "label": "calls"}}, {"data": {"id": "edge_7", "source": "advisories", "target": "pydeepmesh", "label": "calls"}}, {"data": {"id": "edge_8", "source": "advisories", "target": "models", "label": "calls"}}, {"data": {"id": "edge_9", "source": "cli", "target": "pydeepmesh", "label": "calls"}}, {"data": {"id": "edge_10", "source": "cli", "target": "advisories", "label": "calls"}}, {"data": {"id": "edge_11", "source": "cli", "target": "graph", "label": "calls"}}, {"data": {"id": "edge_12", "source": "cli", "target": "models", "label": "calls"}}, {"data": {"id": "edge_13", "source": "cli", "target": "report", "label": "calls"}}, {"data": {"id": "edge_14", "source": "cli", "target": "risk", "label": "calls"}}, {"data": {"id": "edge_15", "source": "cli", "target": "sbom", "label": "calls"}}, {"data": {"id": "edge_16", "source": "discovery", "target": "pydeepmesh", "label": "calls"}}, {"data": {"id": "edge_17", "source": "discovery", "target": "parsers", "label": "calls"}}, {"data": {"id": "edge_18", "source": "graph", "target": "pydeepmesh", "label": "calls"}}, {"data": {"id": "edge_19", "source": "graph", "target": "advisories", "label": "calls"}}, {"data": {"id": "edge_20", "source": "graph", "target": "models", "label": "calls"}}, {"data": {"id": "edge_21", "source": "models", "target": "pydeepmesh", "label": "calls"}}, {"data": {"id": "edge_22", "source": "report", "target": "pydeepmesh", "label": "calls"}}, {"data": {"id": "edge_23", "source": "report", "target": "graph", "label": "calls"}}, {"data": {"id": "edge_24", "source": "report", "target": "models", "label": "calls"}}, {"data": {"id": "edge_25", "source": "risk", "target": "pydeepmesh", "label": "calls"}}, {"data": {"id": "edge_26", "source": "risk", "target": "advisories", "label": "calls"}}, {"data": {"id": "edge_27", "source": "risk", "target": "graph", "label": "calls"}}, {"data": {"id": "edge_28", "source": "risk", "target": "models", "label": "calls"}}, {"data": {"id": "edge_29", "source": "sbom", "target": "pydeepmesh", "label": "calls"}}, {"data": {"id": "edge_30", "source": "sbom", "target": "advisories", "label": "calls"}}, {"data": {"id": "edge_31", "source": "sbom", "target": "models", "label": "calls"}}]};
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: data,
  style: [
    { selector: 'node', style: {
      'label': 'data(label)',
      'shape': 'round-rectangle',
      'background-color': '#eef2ff',
      'border-color': '#6366f1',
      'border-width': 1,
      'width': 'label',
      'padding': '10px',
      'text-valign': 'center',
      'text-halign': 'center',
      'font-size': '12px',
    }},
    { selector: 'edge', style: {
      'label': 'data(label)',
      'curve-style': 'bezier',
      'target-arrow-shape': 'triangle',
      'font-size': '10px',
      'text-rotation': 'autorotate',
    }}
  ],
  layout: { name: 'dagre', rankDir: 'LR' }
});
cy.on('tap', 'node', evt => {
  const node = evt.target;
  if (node.data('linkUrl')) { window.location.href = node.data('linkUrl'); }
});
</script>
</body>
</html>
