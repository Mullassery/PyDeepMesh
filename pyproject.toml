[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pydeepmesh"
version = "0.1.0"
description = "Deterministic, extensible dependency-graph, vulnerability, and attack-surface intelligence for Python, Rust, Node.js, and container projects."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PyDeepMesh Contributors" }]
keywords = ["dependency-graph", "sbom", "vulnerability", "osv", "cyclonedx", "sarif", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  "packaging>=23.2,<26",
  "tomli>=2.0.1,<3 ; python_version < '3.11'",
  "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
architecture = [
  "codeatlas-rs>=0.3.0",
]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "jsonschema>=4.21,<5",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
pydeepmesh = "pydeepmesh.cli.main:main"

[project.urls]
Homepage = "https://github.com/Mullassery/PyDeepMesh"
Repository = "https://github.com/Mullassery/PyDeepMesh"
Issues = "https://github.com/Mullassery/PyDeepMesh/issues"
Changelog = "https://github.com/Mullassery/PyDeepMesh/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Mullassery/PyDeepMesh#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/pydeepmesh"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter; long URLs/strings are tolerated

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
files = ["src/pydeepmesh"]
namespace_packages = true

[[tool.mypy.overrides]]
module = ["yaml.*", "jsonschema.*", "tomli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "network: tests that require live network access (deselected by default)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pydeepmesh"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "jsonschema>=4.21,<5",
  "types-PyYAML>=6.0.12",
]
